name: ArchiveTune - Sync latest stable release

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

env:
  SOURCE_REPO: rukamori/ArchiveTune
  TARGET_REPO: ArchiveTune

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Create target repository and synchronize release
        env:
          # Required for creating another repository and pushing to it.
          # When this workflow is copied, add a PAT with repo permissions as REPO_SYNC_TOKEN.
          SYNC_TOKEN: ${{ secrets.REPO_SYNC_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SYNC_TOKEN:-}" ]]; then
            echo "::error::Configure the REPO_SYNC_TOKEN secret with a token that can create and write repositories."
            exit 1
          fi

          export GH_TOKEN="$SYNC_TOKEN"
          target="${REPO_OWNER}/${TARGET_REPO}"
          target_dir="${RUNNER_TEMP}/target-repository"
          work_dir="${RUNNER_TEMP}/archivetune"
          rm -rf "$target_dir" "$work_dir"
          mkdir -p "$work_dir/extracted"

          # The workflow creates the target repository on the first run when needed.
          if ! gh repo view "$target" >/dev/null 2>&1; then
            gh repo create "$target" --public \
              --description "Mirror of the latest stable ${SOURCE_REPO} release"
          fi

          remote_url="https://x-access-token:${SYNC_TOKEN}@github.com/${target}.git"
          if git ls-remote --exit-code "$remote_url" refs/heads/main >/dev/null 2>&1; then
            git clone "$remote_url" "$target_dir"
          else
            mkdir -p "$target_dir"
            git -C "$target_dir" init -b main >/dev/null
            git -C "$target_dir" remote add origin "$remote_url"
          fi

          release_json="$(curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${SOURCE_REPO}/releases/latest")"
          tag="$(jq -er '.tag_name' <<<"$release_json")"
          release_url="$(jq -er '.html_url' <<<"$release_json")"
          zip_url="$(jq -er '.zipball_url' <<<"$release_json")"
          echo "Latest stable release: ${tag} (${release_url})"

          curl --fail-with-body --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$zip_url" --output "$work_dir/release.zip"
          unzip -q "$work_dir/release.zip" -d "$work_dir/extracted"
          source_dir="$(find "$work_dir/extracted" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$source_dir"

          cd "$target_dir"
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a "$source_dir"/. .

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            echo "No changes detected; target is already synchronized."
            exit 0
          fi
          git commit -m "Sync ArchiveTune ${tag}"
          git push origin HEAD:main
