name: Sync latest stable ArchiveTune release

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          work_dir="${RUNNER_TEMP}/archivetune"
          rm -rf "$work_dir"
          mkdir -p "$work_dir/extracted"

          release_json="$(curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/rukamori/ArchiveTune/releases/latest)"

          tag="$(jq -er '.tag_name' <<<"$release_json")"
          release_url="$(jq -er '.html_url' <<<"$release_json")"
          zip_url="$(jq -er '.zipball_url' <<<"$release_json")"
          echo "Latest stable release: ${tag} (${release_url})"

          curl --fail-with-body --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$zip_url" \
            --output "$work_dir/release.zip"

          unzip -q "$work_dir/release.zip" -d "$work_dir/extracted"
          source_dir="$(find "$work_dir/extracted" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$source_dir"

          # The workflow must remain in place so future scheduled runs continue to work.
          workflow_backup="$work_dir/sync-archivetune.yml"
          cp .github/workflows/sync-archivetune.yml "$workflow_backup"

          # Remove mirrored contents while preserving .git and this workflow.
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf {} +
          find .github -mindepth 1 -maxdepth 1 \
            ! -name 'workflows' \
            -exec rm -rf {} + 2>/dev/null || true
          find .github/workflows -mindepth 1 -maxdepth 1 \
            ! -name 'sync-archivetune.yml' \
            -exec rm -rf {} + 2>/dev/null || true

          cp -a "$source_dir"/. .
          mkdir -p .github/workflows
          cp "$workflow_backup" .github/workflows/sync-archivetune.yml

          echo "SYNC_RELEASE_TAG=${tag}" >> "$GITHUB_ENV"

      - name: Commit and push changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            echo "No changes detected; repository is already synchronized."
            exit 0
          fi
          git commit -m "Sync ArchiveTune ${SYNC_RELEASE_TAG}"
          git push origin HEAD:main
